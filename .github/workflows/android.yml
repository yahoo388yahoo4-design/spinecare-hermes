name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"
      - name: Assemble debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Unit tests
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: spinecare-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r server/requirements.txt fastapi uvicorn websockets httpx pillow numpy
      - name: Run pose/framing/rep tests
        working-directory: server
        run: python -m pytest test_pose.py -v
