name: SpineCare
options:
  bundleIdPrefix: com.spinecare
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  SpineCare:
    type: application
    platform: iOS
    sources:
      - SpineCare
      - path: ../assets/guides
        buildPhase: resources
    info:
      path: SpineCare/Info.plist
      properties:
        CFBundleDisplayName: SpineCare
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ro]
        CFBundleAllowMixedLocalizations: true
        NSCameraUsageDescription: "SpineCare uses the camera to guide and monitor your rehabilitation exercises. Video never leaves the device unless you enable the GPU server."
        NSMotionUsageDescription: "Used for posture context during exercises."
        NSMicrophoneUsageDescription: "Used only for voice commands (start/stop/next/repeat) during exercises. Audio is processed on-device and never stored or uploaded."
        NSSpeechRecognitionUsageDescription: "Used to recognize the voice commands start, stop, next and repeat during exercise sessions. Recognition runs on-device when available."
        UIBackgroundModes: []
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spinecare.app
        INFOPLIST_FILE: SpineCare/Info.plist
